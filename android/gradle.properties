# ALMON-OVERRIDE — read this before changing any org.gradle.* value below.
#
# On molly, ~/.gradle/gradle.properties (almon-owned; source
# ~/almon/tools/gradle.properties) takes PRECEDENCE over this file — user-home
# properties outrank project properties, verified by controlled test 2026-08-13.
# Almon sets, and therefore overrides here:
#
#     org.gradle.workers.max        org.gradle.jvmargs
#     org.gradle.caching            org.gradle.daemon.idletimeout
#
# Editing org.gradle.jvmargs below and seeing no effect is expected, not a bug.
# Change ~/almon/tools/gradle.properties instead, redeploy it to ~/.gradle/, and
# keep conformance green (~/almon/conformance/test_android_toolchain.py).
#
# The values are kept here anyway: they are the portable fallback for a clone on
# any machine that has no almon layer. Almon owns the versions in
# build.gradle.kts too (intent.ANDROID_TOOLCHAIN) but never rewrites them at
# build time — this repo stays reproducible off molly.
#
# Was -Xmx2g, which forked a second ~3G Gradle daemon on molly: daemons are keyed
# on (Gradle version, JVM, JVM args), so pupil could share nothing with hartley
# and shamoji. Matched to theirs.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Was absent, so pupil rebuilt against a ~3G shared build cache it never read.
org.gradle.caching=true

# Project-owned: a build-compatibility flag, not machine policy, so almon does
# not force it. Enabled here only after verifying it on the box — assembleDebug
# stored an entry, a second run reported "Configuration cache entry reused", and
# testDebugUnitTest passed.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.experimental.enableScreenshotTest=true
